<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <title>Future Labs LLC — white wordmark</title>
  <desc>Future Labs LLC logo — white wordmark version for dark backgrounds</desc>

  <!-- Icon background -->
  <rect x="2" y="4" width="44" height="52" rx="8" fill="#1a3a6b"/>
  <rect x="2" y="4" width="44" height="52" rx="8" fill="none" stroke="#2a6dd9" stroke-width="1.5"/>

  <!-- F letterform from code lines -->
  <line x1="12" y1="16" x2="36" y2="16" stroke="#2a6dd9" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="12" y1="16" x2="12" y2="32" stroke="#2a6dd9" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="30" y2="32" stroke="#4a7fd4" stroke-width="3" stroke-linecap="round"/>
  <line x1="12" y1="43" x2="28" y2="43" stroke="#4a7fd4" stroke-width="3" stroke-linecap="round"/>

  <!-- Dot accent -->
  <circle cx="37" cy="43" r="4" fill="#2a6dd9"/>

  <!-- Wordmark white -->
  <text x="58" y="30" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#e8edf5" letter-spacing="0.3">Future Labs</text>
  <text x="58" y="47" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="400" fill="#4a7fd4" letter-spacing="4">LLC</text>
</svg>
